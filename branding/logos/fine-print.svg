<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="lens"><circle cx="452" cy="452" r="196"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef7"/><stop offset="1" stop-color="#f3efe6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- the fine print: tiny lines -->
  <g fill="#d6d2c8">
    <rect x="200" y="300" width="560" height="22" rx="11"/>
    <rect x="200" y="352" width="620" height="22" rx="11"/>
    <rect x="200" y="404" width="520" height="22" rx="11"/>
    <rect x="200" y="456" width="600" height="22" rx="11"/>
    <rect x="200" y="508" width="480" height="22" rx="11"/>
    <rect x="200" y="560" width="580" height="22" rx="11"/>
    <rect x="200" y="612" width="400" height="22" rx="11"/>
  </g>
  <!-- inside the lens: magnified, one line revealed -->
  <circle cx="452" cy="452" r="196" fill="#fffef7"/>
  <g clip-path="url(#lens)">
    <rect x="250" y="352" width="330" height="36" rx="18" fill="#d6d2c8"/>
    <rect x="236" y="430" width="420" height="52" rx="26" fill="#4db8a8"/>
    <rect x="250" y="524" width="400" height="36" rx="18" fill="#d6d2c8"/>
  </g>
  <!-- lens rim + handle -->
  <circle cx="452" cy="452" r="196" fill="none" stroke="#1a1a2e" stroke-width="40"/>
  <line x1="600" y1="600" x2="770" y2="770" stroke="#1a1a2e" stroke-width="72" stroke-linecap="round"/>
</svg>
